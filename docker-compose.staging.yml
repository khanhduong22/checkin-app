services:
  # ----------------------------------------------------------------------------
  # 1. Checkin API Service v2 (Staging on checkin_db_v2)
  # ----------------------------------------------------------------------------
  checkin-api-v2:
    image: ghcr.io/khanhduong22/checkin-app/checkin-api:staging
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: checkin-api-v2
    init: true
    restart: unless-stopped
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://kido:KidoVPS2026!@checkin-db:5432/checkin_db_v2?sslmode=disable
      - REDIS_URL=redis://checkin-valkey:6379
      - MEILISEARCH_HOST=http://meilisearch:7700
      - MEILISEARCH_KEY=kt_meilisearch_master_key_2026_safe
      - NEXTAUTH_SECRET=checkin-app-jwt-secret-monorepo-safe-2026
    networks:
      - ops_bridge
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4000/health | grep -q '\"status\":\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 2. Checkin Admin SPA v2 (Vite React + Nginx Alpine static server)
  # ----------------------------------------------------------------------------
  checkin-admin-v2:
    image: ghcr.io/khanhduong22/checkin-app/checkin-admin:staging
    build:
      context: .
      dockerfile: apps/admin-spa/Dockerfile
    container_name: checkin-admin-v2
    restart: unless-stopped
    networks:
      - ops_bridge
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3001/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 3. Checkin Staff PWA v2 (Vite React PWA + Nginx Alpine static server)
  # ----------------------------------------------------------------------------
  checkin-staff-v2:
    image: ghcr.io/khanhduong22/checkin-app/checkin-staff:staging
    build:
      context: .
      dockerfile: apps/staff-pwa/Dockerfile
    container_name: checkin-staff-v2
    restart: unless-stopped
    networks:
      - ops_bridge
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3002/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ops_bridge:
    external: true
