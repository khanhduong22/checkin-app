# ==============================================================================
# Nginx Reverse Proxy Configuration for Checkin App 3-Tier Monorepo
# Domain: limart.khanhdp.com
# Zero-Downtime Multi-Service Reverse Proxy Configuration
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # High performance I/O
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # Logging format with request timing
    log_format main_timed '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for" '
                          'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main_timed;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/ld+json
        application/manifest+json
        image/svg+xml;

    # Upstream Pools with Persistent Keepalive Connections
    upstream upstream_checkin_api {
        server checkin-api:4000;
        keepalive 32;
    }

    upstream upstream_checkin_admin {
        server checkin-admin:3001;
        keepalive 16;
    }

    upstream upstream_checkin_staff {
        server checkin-staff:3002;
        keepalive 16;
    }

    # WebSocket Upgrade Mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # --------------------------------------------------------------------------
    # HTTP: Redirect all plain HTTP traffic to HTTPS
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name limart.khanhdp.com;

        # Let's Encrypt ACME challenge location
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # HTTPS: SSL Termination & Intelligent Layer-7 Routing
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name limart.khanhdp.com;

        # SSL Configuration
        ssl_certificate /etc/letsencrypt/live/limart.khanhdp.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/limart.khanhdp.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        client_max_body_size 25M;

        # ----------------------------------------------------------------------
        # 1. API Service: /api/* -> checkin-api:4000
        # ----------------------------------------------------------------------
        location /api/ {
            proxy_pass http://upstream_checkin_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # Healthcheck endpoint
        location /health {
            proxy_pass http://upstream_checkin_api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ----------------------------------------------------------------------
        # 2. Admin SPA: /admin/* -> checkin-admin:3001
        # ----------------------------------------------------------------------
        location /admin/ {
            proxy_pass http://upstream_checkin_admin;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /admin {
            return 301 /admin/;
        }

        # ----------------------------------------------------------------------
        # 3. Staff PWA: /* -> checkin-staff:3002 (Default Route)
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://upstream_checkin_staff;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
