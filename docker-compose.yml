version: '3.8'

services:
  checkin-app:
    image: ghcr.io/khanhduong22/checkin-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: checkin-app
    init: true
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://checkin-valkey:6379
      - MEILISEARCH_HOST=http://meilisearch:7700
      - MEILISEARCH_KEY=kt_meilisearch_master_key_2026_safe
    env_file:
      - .env
    depends_on:
      - checkin-db
      - checkin-valkey
    networks:
      - ops_bridge

  checkin-valkey:
    image: valkey/valkey:8-alpine
    container_name: checkin-valkey
    restart: unless-stopped
    command: valkey-server --maxmemory 64mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "6389:6379"
    mem_limit: 64m
    networks:
      - ops_bridge

  checkin-db:
    image: pgvector/pgvector:pg17
    container_name: checkin-db
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_DB: checkin_db
      POSTGRES_USER: kido
      POSTGRES_PASSWORD: KidoVPS2026!
    volumes:
      - checkin_pgdata:/var/lib/postgresql/data
    networks:
      - ops_bridge

networks:
  ops_bridge:
    external: true

volumes:
  checkin_pgdata:
